name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run skill script tests
        run: |
          set -e
          for d in $(find plugins -type d -name scripts); do
            echo "== $d"
            (cd "$d" && python -m unittest -v)
          done
